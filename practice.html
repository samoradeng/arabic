<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jordanian Arabic Practice Tool</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
  }
  .container { max-width: 720px; margin: 0 auto; padding: 20px; }

  /* Header */
  .header {
    text-align: center;
    padding: 30px 0 20px;
    border-bottom: 1px solid #1e293b;
    margin-bottom: 24px;
  }
  .header h1 { font-size: 1.6em; color: #f8fafc; margin-bottom: 6px; }
  .header p { color: #94a3b8; font-size: 0.95em; }
  .streak {
    display: inline-block;
    background: #1e293b;
    padding: 6px 16px;
    border-radius: 20px;
    margin-top: 10px;
    font-size: 0.85em;
    color: #fbbf24;
  }

  /* Navigation */
  .nav {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }
  .nav-btn {
    background: #1e293b;
    border: 1px solid #334155;
    color: #e2e8f0;
    padding: 16px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 1em;
    transition: all 0.2s;
    text-align: left;
  }
  .nav-btn:hover { background: #334155; border-color: #4f9cf7; }
  .nav-btn .icon { font-size: 1.4em; display: block; margin-bottom: 6px; }
  .nav-btn .label { font-weight: 600; }
  .nav-btn .desc { font-size: 0.8em; color: #94a3b8; margin-top: 4px; }

  /* Cards */
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 16px;
    border: 1px solid #334155;
  }

  /* Flashcard */
  .flashcard {
    min-height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s;
    user-select: none;
  }
  .flashcard:hover { border-color: #4f9cf7; }
  .flashcard .arabic { font-size: 2.4em; margin-bottom: 12px; direction: rtl; font-family: 'Noto Sans Arabic', 'Geeza Pro', 'Traditional Arabic', serif; }
  .flashcard .translit { font-size: 1.1em; color: #94a3b8; margin-bottom: 8px; }
  .flashcard .english { font-size: 1.2em; color: #4ade80; }
  .flashcard .tap-hint { color: #475569; font-size: 0.85em; margin-top: 16px; }
  .flashcard .day-tag { font-size: 0.75em; color: #64748b; background: #0f172a; padding: 3px 10px; border-radius: 10px; margin-bottom: 12px; }

  /* Buttons */
  .btn-row { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
  .btn {
    padding: 12px 28px;
    border-radius: 10px;
    border: none;
    font-size: 1em;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
  }
  .btn-yes { background: #166534; color: #fff; }
  .btn-yes:hover { background: #15803d; }
  .btn-no { background: #991b1b; color: #fff; }
  .btn-no:hover { background: #b91c1c; }
  .btn-skip { background: #334155; color: #94a3b8; }
  .btn-skip:hover { background: #475569; }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:hover { background: #3b82f6; }
  .btn-back { background: #334155; color: #94a3b8; }
  .btn-back:hover { background: #475569; color: #e2e8f0; }

  /* Progress bar */
  .progress-bar {
    width: 100%;
    height: 6px;
    background: #334155;
    border-radius: 3px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #2563eb, #4f9cf7);
    border-radius: 3px;
    transition: width 0.3s;
  }
  .progress-text { text-align: center; color: #94a3b8; font-size: 0.85em; margin-bottom: 12px; }

  /* Quiz */
  .quiz-prompt { font-size: 1.3em; text-align: center; margin-bottom: 20px; }
  .quiz-prompt .highlight { color: #fbbf24; }
  .quiz-input {
    width: 100%;
    padding: 14px;
    background: #0f172a;
    border: 2px solid #334155;
    border-radius: 10px;
    color: #e2e8f0;
    font-size: 1.1em;
    text-align: center;
    outline: none;
  }
  .quiz-input:focus { border-color: #4f9cf7; }
  .quiz-input::placeholder { color: #475569; }
  .quiz-feedback {
    text-align: center;
    padding: 12px;
    border-radius: 10px;
    margin-top: 12px;
    font-size: 1em;
  }
  .quiz-feedback.correct { background: #052e16; color: #4ade80; }
  .quiz-feedback.wrong { background: #450a0a; color: #fca5a5; }

  /* Score */
  .score-card {
    text-align: center;
    padding: 30px;
  }
  .score-card .big-score { font-size: 3em; font-weight: 700; color: #4f9cf7; }
  .score-card .score-label { color: #94a3b8; margin-top: 4px; }
  .score-bar {
    width: 100%;
    height: 12px;
    background: #334155;
    border-radius: 6px;
    margin: 20px 0;
    overflow: hidden;
  }
  .score-bar-fill {
    height: 100%;
    border-radius: 6px;
    transition: width 0.5s;
  }
  .score-msg { margin-top: 12px; font-size: 1.05em; }

  /* Conjugation */
  .conj-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  .conj-table td, .conj-table th {
    padding: 10px 14px;
    border-bottom: 1px solid #1e293b;
    text-align: center;
  }
  .conj-table th { color: #94a3b8; font-weight: 500; font-size: 0.85em; }
  .conj-table .pronoun { color: #fbbf24; font-size: 1.1em; direction: rtl; }
  .conj-table input {
    background: #0f172a;
    border: 1px solid #334155;
    color: #e2e8f0;
    padding: 8px;
    border-radius: 6px;
    width: 120px;
    text-align: center;
    font-size: 1em;
    direction: rtl;
  }
  .conj-table input:focus { border-color: #4f9cf7; outline: none; }
  .conj-table .correct-cell { color: #4ade80; }
  .conj-table .wrong-cell { color: #f87171; }

  /* Day selector */
  .day-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin: 16px 0;
  }
  .day-btn {
    background: #0f172a;
    border: 1px solid #334155;
    color: #94a3b8;
    padding: 10px 4px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9em;
    text-align: center;
    position: relative;
  }
  .day-btn:hover { border-color: #4f9cf7; color: #e2e8f0; }
  .day-btn.active { background: #2563eb; border-color: #2563eb; color: #fff; }
  .day-btn.locked {
    opacity: 0.4;
    cursor: not-allowed;
    pointer-events: none;
  }
  .day-btn.completed { border-color: #4ade80; }
  .day-btn .lock-icon {
    font-size: 0.7em;
    display: block;
    margin-top: 2px;
  }
  .day-btn .check-icon {
    color: #4ade80;
    font-size: 0.7em;
    display: block;
    margin-top: 2px;
  }
  .unlock-msg {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 10px 14px;
    margin-top: 12px;
    font-size: 0.85em;
    color: #fbbf24;
    text-align: center;
  }
  .week-label { color: #64748b; font-size: 0.8em; margin-top: 12px; margin-bottom: 6px; }

  /* Missed words */
  .missed-list { margin-top: 16px; }
  .missed-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 14px;
    background: #0f172a;
    border-radius: 8px;
    margin-bottom: 6px;
    direction: rtl;
  }
  .missed-item .ar { font-size: 1.1em; }
  .missed-item .en { color: #94a3b8; direction: ltr; }

  /* Conversation */
  .chat-bubble {
    padding: 12px 18px;
    border-radius: 16px;
    margin-bottom: 10px;
    max-width: 85%;
    line-height: 1.5;
  }
  .chat-bubble.them {
    background: #334155;
    border-bottom-left-radius: 4px;
    margin-right: auto;
  }
  .chat-bubble.you {
    background: #1e3a5f;
    border-bottom-right-radius: 4px;
    margin-left: auto;
  }
  .chat-speaker { font-size: 0.75em; color: #64748b; margin-bottom: 4px; }
  .chat-arabic { direction: rtl; font-size: 1.15em; margin-bottom: 4px; }
  .chat-translit { font-size: 0.85em; color: #94a3b8; font-style: italic; }

  .hidden { display: none !important; }

  /* Audio button */
  .audio-btn {
    background: none;
    border: 2px solid #334155;
    color: #4f9cf7;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.4em;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin: 4px;
  }
  .audio-btn:hover { border-color: #4f9cf7; background: #1e3a5f; }
  .audio-btn:active { transform: scale(0.9); }
  .audio-btn.playing { border-color: #4ade80; color: #4ade80; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .audio-btn-sm {
    background: none;
    border: 1px solid #334155;
    color: #4f9cf7;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1em;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-left: 8px;
    flex-shrink: 0;
  }
  .audio-btn-sm:hover { border-color: #4f9cf7; background: #1e3a5f; }

  /* Listening quiz */
  .listen-choices {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-top: 20px;
  }
  .listen-choice {
    background: #0f172a;
    border: 2px solid #334155;
    color: #e2e8f0;
    padding: 16px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 1.05em;
    transition: all 0.2s;
    text-align: center;
  }
  .listen-choice:hover { border-color: #4f9cf7; background: #1e293b; }
  .listen-choice.correct-choice { border-color: #4ade80; background: #052e16; }
  .listen-choice.wrong-choice { border-color: #f87171; background: #450a0a; }

  /* Shadowing */
  .shadow-card {
    text-align: center;
    padding: 30px;
  }
  .shadow-phase {
    font-size: 0.9em;
    color: #94a3b8;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .shadow-timer {
    font-size: 2em;
    color: #fbbf24;
    margin: 16px 0;
    font-variant-numeric: tabular-nums;
  }
  .recording-dot {
    display: inline-block;
    width: 12px;
    height: 12px;
    background: #f87171;
    border-radius: 50%;
    margin-right: 8px;
    animation: pulse 1s infinite;
  }
  .speed-btn {
    background: #0f172a;
    border: 1px solid #334155;
    color: #94a3b8;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85em;
    margin: 0 4px;
  }
  .speed-btn.active { background: #2563eb; border-color: #2563eb; color: #fff; }

  /* Responsive */
  @media (max-width: 500px) {
    .nav { grid-template-columns: 1fr; }
    .day-grid { grid-template-columns: repeat(4, 1fr); }
    .flashcard .arabic { font-size: 1.8em; }
  }
</style>
</head>

<div class="container">

  </div>

      <button class="nav-btn" onclick="startConjugation()">
        <span class="icon">&#x1F524;</span>
        <span class="label">Conjugation Drill</span>
        <span class="desc">Verb forms practice</span>
      </button>
      <button class="nav-btn" onclick="startPhraseBuilder()">
        <span class="icon">&#x1F9E9;</span>
        <span class="label">Phrase Builder</span>
        <span class="desc">Build sentences from parts</span>
      </button>
      <button class="nav-btn" onclick="startListeningQuiz()">
        <span class="icon">&#x1F50A;</span>
        <span class="label">Listening Quiz</span>
        <span class="desc">Hear Arabic, pick meaning</span>
      </button>
      <button class="nav-btn" onclick="startShadowing()">
        <span class="icon">&#x1F3A4;</span>
        <span class="label">Shadowing</span>
        <span class="desc">Listen, repeat, speak</span>
      </button>
      <button class="nav-btn" onclick="startConversation()">
        <span class="icon">&#x1F4AC;</span>
        <span class="label">Conversations</span>
        <span class="desc">Real-world dialogues with audio</span>

      <button class="nav-btn" onclick="showStats()">
        <span class="icon">&#x1F4CA;</span>
        <span class="label">Progress</span>
        <span class="desc">Your stats & streak</span>
      </button>
    </div>
    <div id="daySelector"></div>
  </div>

  <!-- Activity Area -->
  <div id="activity" class="hidden"></div>
</div>

// ============ STATE ============
let selectedDays = new Set();
let currentCards = [];
let currentIndex = 0;
let correct = 0;
let revealed = false;
let missed = [];

// ============ PROGRESS ============
const WEEK_MAP = {1:1,2:1,3:1,4:1,5:1,6:1, 8:2,9:2,10:2,12:2,13:2, 15:3,16:3,20:3};
const WEEK_DAYS = {1:[1,2,3,4,5,6], 2:[8,9,10,12,13], 3:[15,16,20]};
const DAY_ORDER = [1,2,3,4,5,6,8,9,10,12,13,15,16,20];
const UNLOCK_THRESHOLD = 0.6; // 60% mastery to unlock next day

function isDayUnlocked(dayNum) {
  const idx = DAY_ORDER.indexOf(dayNum);
  if (idx <= 0) return true; // Day 1 always unlocked
  const prevDay = DAY_ORDER[idx - 1];
  const dm = getDayMastery(prevDay);
  return dm.pct >= UNLOCK_THRESHOLD * 100;
}

function getHighestUnlockedDay() {
  for (let i = DAY_ORDER.length - 1; i >= 0; i--) {
    if (isDayUnlocked(DAY_ORDER[i])) return DAY_ORDER[i];
  }
  return 1;
}

function renderDaySelector() {
  const container = document.getElementById('daySelector');
  if (!container) return;
  const wkNames = {1:'Week 1: Foundations', 2:'Week 2: Conversations', 3:'Week 3: Fluency'};
  let html = '<p style="color:#94a3b8;font-size:0.9em;margin-bottom:8px;">Select a day to practice (unlock by mastering the previous day):</p>';

  [1,2,3].forEach(wk => {
    html += `<div class="week-label">${wkNames[wk]}</div><div class="day-grid">`;
    WEEK_DAYS[wk].forEach(d => {
      const unlocked = isDayUnlocked(d);
      const dm = getDayMastery(d);
      const completed = dm.pct >= 60;
      const isActive = selectedDays.has(d);
      let cls = 'day-btn';
      if (!unlocked) cls += ' locked';
      if (isActive) cls += ' active';
      if (completed && unlocked) cls += ' completed';

      let statusIcon = '';
      if (!unlocked) {
        statusIcon = '<span class="lock-icon">&#x1F512;</span>';
      } else if (completed) {
        statusIcon = '<span class="check-icon">&#x2713;</span>';
      }
      html += `<button class="${cls}" data-day="${d}" onclick="toggleDay(this)">Day ${d}${statusIcon}</button>`;
    });
    html += '</div>';
  });

  // Show what to unlock next
  const nextLocked = DAY_ORDER.find(d => !isDayUnlocked(d));
  if (nextLocked) {
    const prevDay = DAY_ORDER[DAY_ORDER.indexOf(nextLocked) - 1];
    const dm = getDayMastery(prevDay);
    const needed = Math.ceil(UNLOCK_THRESHOLD * dm.total) - dm.mastered;
    if (needed > 0) {
      html += `<div class="unlock-msg">Master ${needed} more word${needed===1?'':'s'} from Day ${prevDay} to unlock Day ${nextLocked}</div>`;
    }
  }

  container.innerHTML = html;
}

function loadProgress() {
  try {
    const d = JSON.parse(localStorage.getItem('jaProg')) || {};
    return {scores:d.scores||{}, streak:d.streak||0, lastDate:d.lastDate||null,
            totalSessions:d.totalSessions||0, history:d.history||[]};
  } catch { return {scores:{},streak:0,lastDate:null,totalSessions:0,history:[]}; }
}
function saveProgress(p) { localStorage.setItem('jaProg', JSON.stringify(p)); }
function logSession(type, score, count) {
  const p = loadProgress();
  p.history.push({date:new Date().toISOString().slice(0,10), type, score, count, time:Date.now()});
  // Keep last 100 sessions
  if (p.history.length > 100) p.history = p.history.slice(-100);
  saveProgress(p);
}
function updateStreak() {
  const p = loadProgress();
  const today = new Date().toISOString().slice(0,10);
  if (p.lastDate === today) return p;
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  p.streak = p.lastDate === yesterday ? (p.streak||0)+1 : 1;
  p.lastDate = today;
  p.totalSessions = (p.totalSessions||0)+1;
  saveProgress(p);
  return p;
}
function getDayMastery(dayNum) {
  const p = loadProgress();
  const words = VOCAB[dayNum] || [];
  if (words.length === 0) return {mastered:0,learning:0,total:0,pct:0};
  let mastered = 0, learning = 0;
  words.forEach(w => {
    const s = p.scores[w[0]] || 0;
    if (s >= 2) mastered++;
    else if (s > 0) learning++;
  });
  return {mastered, learning, total:words.length, pct:Math.round(mastered/words.length*100)};
}
function getWeekMastery(weekNum) {
  const days = WEEK_DAYS[weekNum] || [];
  let mastered=0, learning=0, total=0;
  days.forEach(d => {
    const dm = getDayMastery(d);
    mastered += dm.mastered; learning += dm.learning; total += dm.total;
  });
  return {mastered, learning, total, pct: total>0 ? Math.round(mastered/total*100) : 0};
}

// ============ HELPERS ============
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function getVocab() {
  let items = [];
  let days;
  if (selectedDays.size > 0) {
    days = [...selectedDays].filter(d => isDayUnlocked(d));
  } else {
    days = DAY_ORDER.filter(d => isDayUnlocked(d));
  }
  days.forEach(d => { if(VOCAB[d]) VOCAB[d].forEach(v => items.push({day:d,ar:v[0],tr:v[1],en:v[2]})); });
  return items;
}
function toggleDay(btn) {
  const d = parseInt(btn.dataset.day);
  if (!isDayUnlocked(d)) return;
  if (selectedDays.has(d)) { selectedDays.delete(d); btn.classList.remove('active'); }
  else { selectedDays.add(d); btn.classList.add('active'); }
}
function showMenu() {
  document.getElementById('menu').classList.remove('hidden');
  document.getElementById('activity').classList.add('hidden');
  renderDaySelector();
}
function showActivity(html) {
  document.getElementById('menu').classList.add('hidden');
  const el = document.getElementById('activity');
  el.innerHTML = html;
  el.classList.remove('hidden');
}

// ============ FLASHCARDS ============
function startFlashcards() {
  const p = updateStreak();
  document.getElementById('streakDisplay').textContent = p.streak + ' day streak';
  currentCards = shuffle(getVocab()).slice(0, 20);
  currentIndex = 0; correct = 0; revealed = false; missed = [];
  renderFlashcard();
}
function renderFlashcard() {
  if (currentIndex >= currentCards.length) { renderScore('flashcards'); return; }
  const c = currentCards[currentIndex];
  showActivity(`
    <div class="progress-text">${currentIndex+1} / ${currentCards.length}</div>
    <div class="progress-bar"><div class="progress-fill" style="width:${(currentIndex/currentCards.length)*100}%"></div></div>
    <div class="card flashcard" onclick="revealFlashcard()">
      <div class="day-tag">Day ${c.day}</div>
      <div class="arabic">${c.ar}</div>
      <div class="translit ${revealed?'':'hidden'}">${c.tr}</div>
      <div class="english ${revealed?'':'hidden'}">${c.en}</div>
      <div class="tap-hint ${revealed?'hidden':''}">${'Tap to reveal'}</div>
    </div>
    <div class="btn-row ${revealed?'':'hidden'}" id="fcBtns">
      <button class="btn btn-yes" onclick="fcAnswer(true)">Knew it</button>
      <button class="btn btn-no" onclick="fcAnswer(false)">Didn't know</button>
      <button class="btn btn-skip" onclick="fcAnswer(null)">Skip</button>
    </div>
    <div class="btn-row"><button class="btn btn-back" onclick="showMenu()">Back to menu</button></div>
  `);
}
function revealFlashcard() {
  revealed = true;
  renderFlashcard();
}
function fcAnswer(knew) {
  const c = currentCards[currentIndex];
  if (knew === true) { correct++; const p=loadProgress(); p.scores[c.ar]=(p.scores[c.ar]||0)+1; saveProgress(p); }
  else if (knew === false) { missed.push(c); const p=loadProgress(); p.scores[c.ar]=Math.max(0,(p.scores[c.ar]||0)-1); saveProgress(p); }
  currentIndex++; revealed = false;
  renderFlashcard();
}

// ============ QUIZ ============
let quizMode = 'en2ar';
let quizFeedbackTimeout = null;

function startQuiz(mode) {
  quizMode = mode;
  const p = updateStreak();
  document.getElementById('streakDisplay').textContent = p.streak + ' day streak';
  currentCards = shuffle(getVocab()).slice(0, 15);
  currentIndex = 0; correct = 0; missed = [];
  renderQuiz();
}
function renderQuiz() {
  if (currentIndex >= currentCards.length) { renderScore('quiz'); return; }
  const c = currentCards[currentIndex];
  const prompt = quizMode === 'en2ar'
    ? `What is <span class="highlight">${c.en}</span> in Arabic?`
    : `What does <span class="highlight">${c.ar}</span> (${c.tr}) mean?`;
  const placeholder = quizMode === 'en2ar' ? 'Type Arabic or transliteration...' : 'Type the English meaning...';
  showActivity(`
    <div class="progress-text">${currentIndex+1} / ${currentCards.length}</div>
    <div class="progress-bar"><div class="progress-fill" style="width:${(currentIndex/currentCards.length)*100}%"></div></div>
    <div class="card">
      <div class="quiz-prompt">${prompt}</div>
      <input class="quiz-input" id="quizInput" placeholder="${placeholder}" autocomplete="off" onkeydown="if(event.key==='Enter')checkQuiz()">
      <div id="quizFeedback"></div>
      <div class="btn-row" style="margin-top:16px">
        <button class="btn btn-primary" onclick="checkQuiz()">Check</button>
        <button class="btn btn-skip" onclick="skipQuiz()">Skip</button>
      </div>
    </div>
    <div class="btn-row"><button class="btn btn-back" onclick="showMenu()">Back to menu</button></div>
  `);
  setTimeout(() => document.getElementById('quizInput')?.focus(), 100);
}
function checkQuiz() {
  const input = document.getElementById('quizInput')?.value.trim();
  if (!input) return;
  const c = currentCards[currentIndex];
  const fb = document.getElementById('quizFeedback');
  let isCorrect = false;
  if (quizMode === 'en2ar') {
    isCorrect = input === c.ar || input.toLowerCase() === c.tr.toLowerCase().replace(/\?$/,'');
  } else {
    const enWords = new Set(c.en.toLowerCase().replace(/[\/\(\)]/g,' ').split(/\s+/).filter(Boolean));
    const ansWords = new Set(input.toLowerCase().split(/\s+/).filter(Boolean));
    isCorrect = [...ansWords].some(w => enWords.has(w)) || input.toLowerCase() === c.en.toLowerCase();
  }
  if (isCorrect) {
    correct++;
    fb.className = 'quiz-feedback correct';
    fb.textContent = 'Correct!';
  } else {
    missed.push(c);
    fb.className = 'quiz-feedback wrong';
    fb.innerHTML = `Answer: <strong>${quizMode==='en2ar' ? c.ar+' ('+c.tr+')' : c.en}</strong>`;
  }
  clearTimeout(quizFeedbackTimeout);
  quizFeedbackTimeout = setTimeout(() => { currentIndex++; renderQuiz(); }, 1500);
}
function skipQuiz() { currentIndex++; renderQuiz(); }

// ============ SCORE SCREEN ============
function renderScore(type) {
  const pct = Math.round((correct/currentCards.length)*100);
  logSession(type, pct, currentCards.length);
  const color = pct >= 90 ? '#4ade80' : pct >= 70 ? '#fbbf24' : '#f87171';
  const msg = pct >= 90 ? 'Excellent! Ready to move on.' : pct >= 70 ? 'Good job! Review the missed words.' : 'Keep practicing! Try again soon.';
  let missedHtml = '';
  if (missed.length > 0) {
    missedHtml = '<div style="text-align:left;margin-top:20px"><p style="color:#94a3b8;margin-bottom:10px;">Words to review:</p><div class="missed-list">';
    missed.forEach(m => {
      missedHtml += `<div class="missed-item"><span class="ar">${m.ar}</span><span class="en">${m.en} (${m.tr})</span></div>`;
    });
    missedHtml += '</div></div>';
  }
  showActivity(`
    <div class="card score-card">
      <div class="big-score" style="color:${color}">${pct}%</div>
      <div class="score-label">${correct} / ${currentCards.length} correct</div>
      <div class="score-bar"><div class="score-bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="score-msg">${msg}</div>
      ${missedHtml}
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="${type==='flashcards'?'startFlashcards()':'startQuiz(\''+quizMode+'\')'}">Try Again</button>
      <button class="btn btn-back" onclick="showMenu()">Back to Menu</button>
    </div>
  `);
}

function startConjugation() {
  const verbs = Object.keys(CONJUGATIONS);

  verbs.forEach((v,i) => {
    html += `<button class="nav-btn" style="margin-bottom:8px;width:100%" onclick="runConjugation('${v.replace(/'/g,"\\'")}')"><span class="label">${v}</span></button>`;
  });

  html += '</div><div class="btn-row"><button class="btn btn-back" onclick="showMenu()">Back to menu</button></div>';

}
function runConjugation(verb) {
  if (verb === 'random') verb = Object.keys(CONJUGATIONS)[Math.floor(Math.random()*Object.keys(CONJUGATIONS).length)];
  const forms = CONJUGATIONS[verb];
  const pronouns = Object.keys(forms);
  let html = `<div class="card"><h2 style="margin-bottom:4px;">Conjugate:</h2><p style="color:#fbbf24;font-size:1.2em;margin-bottom:16px;">${verb}</p>`;
  html += '<table class="conj-table"><tr><th>Pronoun</th><th>Your Answer</th></tr>';
  pronouns.forEach((pr,i) => {
    html += `<tr><td class="pronoun">${pr}</td><td><input id="conj${i}" onkeydown="if(event.key==='Enter'){const n=document.getElementById('conj${i+1}');if(n)n.focus();else checkConj('${verb.replace(/'/g,"\\'")}');}"></td></tr>`;
  });
  html += '</table>';
  html += '<div class="btn-row" style="margin-top:16px"><button class="btn btn-primary" onclick="checkConj(\'' + verb.replace(/'/g,"\\'") + '\')">Check</button></div></div>';
  html += '<div class="btn-row"><button class="btn btn-back" onclick="startConjugation()">Other verbs</button><button class="btn btn-back" onclick="showMenu()">Menu</button></div>';
  showActivity(html);
  setTimeout(() => document.getElementById('conj0')?.focus(), 100);
}
function checkConj(verb) {
  const forms = CONJUGATIONS[verb];
  const pronouns = Object.keys(forms);
  let score = 0;
  pronouns.forEach((pr,i) => {
    const input = document.getElementById('conj'+i);
    const answer = input.value.trim();
    const expected = forms[pr];
    const cell = input.parentElement;
    if (answer === expected) {
      cell.innerHTML = `<span class="correct-cell">${expected} &#10003;</span>`;
      score++;
    } else {
      cell.innerHTML = `<span class="wrong-cell">${answer||'—'}</span> &rarr; <span class="correct-cell">${expected}</span>`;
    }
  });
  const pct = Math.round(score/pronouns.length*100);
  const row = document.createElement('div');
  row.className = 'progress-text';
  row.style.marginTop = '16px';
  row.style.fontSize = '1.1em';
  row.style.color = pct >= 80 ? '#4ade80' : '#fbbf24';
  row.textContent = `${score}/${pronouns.length} correct (${pct}%)`;
  document.querySelector('.conj-table').after(row);
}

let currentPhraseSlots = [];
function addToPhraseSlot(btn, word) {
  const placeholder = document.getElementById('phrasePlaceholder');
  if (placeholder) placeholder.remove();
  const slots = document.getElementById('phraseSlots');
  const chip = document.createElement('span');
  chip.style.cssText = 'background:#1e3a5f;padding:8px 14px;border-radius:8px;font-size:1.1em;cursor:pointer;';
  chip.textContent = word;
  chip.onclick = () => { chip.remove(); btn.style.display=''; currentPhraseSlots = currentPhraseSlots.filter(w=>w!==word); if(currentPhraseSlots.length===0){slots.innerHTML='<span style="color:#475569;font-size:0.9em;" id="phrasePlaceholder">Tap words below to build the phrase</span>';} };
  slots.appendChild(chip);
  btn.style.display = 'none';
  currentPhraseSlots.push(word);
}

function clearPhrase() {
  currentPhraseSlots = [];
  renderPhrase();
}

function checkPhrase() {
  const ex = phraseCards[phraseIndex];
  const fb = document.getElementById('phraseFeedback');
  const isCorrect = currentPhraseSlots.join(' ') === ex.parts.join(' ');
  if (isCorrect) {
    phraseCorrect++;
    fb.innerHTML = '<div class="quiz-feedback correct">Correct!</div>';
    speak(ex.parts.join(' '));
  } else {
    fb.innerHTML = `<div class="quiz-feedback wrong">Correct order: <strong style="direction:rtl;display:inline-block;">${ex.parts.join(' ')}</strong></div>`;
    speak(ex.parts.join(' '));
  }
  setTimeout(() => { currentPhraseSlots=[]; phraseIndex++; renderPhrase(); }, 2000);
}

// ============ TEXT-TO-SPEECH ============
let arVoice = null;
let speechRate = 0.8;

function initTTS() {
  const voices = speechSynthesis.getVoices();
  arVoice = voices.find(v => v.lang.startsWith('ar')) || null;
}
speechSynthesis.onvoiceschanged = initTTS;
initTTS();

function speak(text, rate) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ar-SA';
  if (arVoice) u.voice = arVoice;
  u.rate = rate || speechRate;
  u.pitch = 1;
  speechSynthesis.speak(u);
  return u;
}

function speakBtn(text, btnEl) {
  if (btnEl) btnEl.classList.add('playing');
  const u = speak(text);
  u.onend = () => { if (btnEl) btnEl.classList.remove('playing'); };
  u.onerror = () => { if (btnEl) btnEl.classList.remove('playing'); };
}

function renderListeningQuiz() {
  if (currentIndex >= currentCards.length) { renderScore('listening'); return; }
  const c = currentCards[currentIndex];
  // Get 3 wrong choices
  const allVocab = getVocab().filter(v => v.en !== c.en);
  const wrongs = shuffle(allVocab).slice(0, 3);
  const choices = shuffle([c, ...wrongs]);

  showActivity(`
    <div class="progress-text">${currentIndex+1} / ${currentCards.length}</div>
    <div class="progress-bar"><div class="progress-fill" style="width:${(currentIndex/currentCards.length)*100}%"></div></div>

      <p style="color:#94a3b8;margin-bottom:16px;">Listen and choose the correct meaning</p>

      <p style="color:#475569;font-size:0.8em;margin-top:8px;">Tap to hear again</p>
      <div class="listen-choices" id="listenChoices">
        ${choices.map((ch, i) => `<button class="listen-choice" data-correct="${ch.en===c.en}" onclick="checkListening(this, ${ch.en===c.en})">${ch.en}</button>`).join('')}
      </div>
    </div>
    <div class="btn-row"><button class="btn btn-back" onclick="showMenu()">Back to menu</button></div>
  `);
  // Auto-play on load
  setTimeout(() => speak(c.ar), 300);
}

function checkListening(btn, isCorrect) {
  const allBtns = document.querySelectorAll('.listen-choice');
  allBtns.forEach(b => { b.onclick = null; b.style.cursor = 'default'; });
  if (isCorrect) {
    correct++;
    btn.classList.add('correct-choice');
  } else {
    btn.classList.add('wrong-choice');
    missed.push(currentCards[currentIndex]);
    allBtns.forEach(b => { if (b.dataset.correct === 'true') b.classList.add('correct-choice'); });
  }
  setTimeout(() => { currentIndex++; renderListeningQuiz(); }, 1200);
}

  showActivity(`
    <div class="progress-text">${shadowIndex+1} / ${shadowCards.length}</div>
    <div class="progress-bar"><div class="progress-fill" style="width:${(shadowIndex/shadowCards.length)*100}%"></div></div>
    <div class="card shadow-card">
      <div class="shadow-phase" id="shadowPhaseText">Step 1: Listen</div>
      <div class="arabic" style="font-size:2.2em;direction:rtl;margin:16px 0;font-family:'Noto Sans Arabic','Geeza Pro','Traditional Arabic',serif;">${c.ar}</div>
      <div style="color:#94a3b8;margin-bottom:4px;">${c.tr}</div>
      <div style="color:#4ade80;margin-bottom:20px;">${c.en}</div>
      <div style="margin-bottom:16px;">
        <span style="color:#64748b;font-size:0.85em;">Speed: </span>
        <button class="speed-btn ${speechRate===0.5?'active':''}" onclick="speechRate=0.5;document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active');">Slow</button>
        <button class="speed-btn ${speechRate===0.8?'active':''}" onclick="speechRate=0.8;document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active');">Normal</button>
        <button class="speed-btn ${speechRate===1.1?'active':''}" onclick="speechRate=1.1;document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active');">Fast</button>
      </div>
      <button class="audio-btn" style="width:64px;height:64px;font-size:1.8em;" id="shadowPlayBtn" onclick="speakBtn('${c.ar.replace(/'/g,"\\'")}', this)">&#x1F50A;</button>
      <div style="margin-top:20px;">
        <p style="color:#94a3b8;font-size:0.9em;" id="shadowInstruction">Tap the speaker to listen, then repeat out loud</p>
      </div>
      <div class="btn-row" style="margin-top:20px;">
        <button class="btn btn-primary" onclick="shadowRepeatPhase('${c.ar.replace(/'/g,"\\'")}')">Listen 3x (Auto)</button>
        <button class="btn btn-yes" onclick="shadowIndex++;renderShadow();">Next</button>
      </div>
    </div>
    <div class="btn-row"><button class="btn btn-back" onclick="showMenu()">Back to menu</button></div>
  `);
  setTimeout(() => speak(c.ar), 400);
}

function shadowRepeatPhase(text) {
  const phaseEl = document.getElementById('shadowPhaseText');
  const instrEl = document.getElementById('shadowInstruction');
  let count = 0;
  function playNext() {
    count++;
    if (count > 3) {
      phaseEl.textContent = 'Your turn! Say it out loud';
      instrEl.textContent = 'Repeat 3 times, matching the rhythm and sound';
      instrEl.style.color = '#fbbf24';
      return;
    }
    phaseEl.textContent = `Listen ${count}/3 — then repeat`;
    instrEl.textContent = count <= 2 ? 'Listen carefully to the sounds...' : 'Last one — prepare to repeat!';
    const u = speak(text, count === 1 ? 0.6 : count === 2 ? 0.8 : 1.0);
    u.onend = () => setTimeout(playNext, count < 3 ? 1500 : 800);
  }
  playNext();
}

// ============ UPDATE FLASHCARDS WITH AUDIO ============
const _origRenderFlashcard = renderFlashcard;
renderFlashcard = function() {
  if (currentIndex >= currentCards.length) { renderScore('flashcards'); return; }
  const c = currentCards[currentIndex];
  showActivity(`
    <div class="progress-text">${currentIndex+1} / ${currentCards.length}</div>
    <div class="progress-bar"><div class="progress-fill" style="width:${(currentIndex/currentCards.length)*100}%"></div></div>
    <div class="card flashcard" onclick="revealFlashcard()">
      <div class="day-tag">Day ${c.day}</div>
      <div class="arabic">${c.ar}</div>
      <button class="audio-btn" onclick="event.stopPropagation();speakBtn('${c.ar.replace(/'/g,"\\'")}',this)">&#x1F50A;</button>
      <div class="translit ${revealed?'':'hidden'}">${c.tr}</div>
      <div class="english ${revealed?'':'hidden'}">${c.en}</div>
      <div class="tap-hint ${revealed?'hidden':''}">Tap card to reveal meaning</div>
    </div>
    <div class="btn-row ${revealed?'':'hidden'}" id="fcBtns">
      <button class="btn btn-yes" onclick="fcAnswer(true)">Knew it</button>
      <button class="btn btn-no" onclick="fcAnswer(false)">Didn't know</button>
      <button class="btn btn-skip" onclick="fcAnswer(null)">Skip</button>
    </div>
    <div class="btn-row"><button class="btn btn-back" onclick="showMenu()">Back to menu</button></div>
  `);
};

// ============ UPDATE CONVERSATIONS WITH AUDIO ============
const _origShowConv = showConversation;
showConversation = function(idx) {
  const c = CONVERSATIONS[idx];
  let html = `<div style="margin-bottom:16px"><h2>${c.title}</h2><p style="color:#94a3b8;font-size:0.9em;margin-top:4px;">Tap speaker to hear, tap bubble for translation</p></div>`;
  html += `<div class="btn-row" style="margin-bottom:16px"><button class="btn btn-primary" onclick="playFullConvo(${idx})">&#x1F50A; Play Full Conversation</button></div>`;
  c.lines.forEach((line,i) => {
    const [speaker,ar,tr,en] = line;
    const cls = speaker === 'You' ? 'you' : 'them';
    const arEsc = ar.replace(/'/g,"\\'");
    html += `<div class="chat-bubble ${cls}" style="display:flex;align-items:flex-start;gap:8px;">
      <div style="flex:1" onclick="this.querySelector('.chat-translit').classList.toggle('hidden');this.querySelector('.chat-en').classList.toggle('hidden');">
        <div class="chat-speaker">${speaker}</div>
        <div class="chat-arabic">${ar}</div>
        <div class="chat-translit hidden">${tr}</div>
        <div class="chat-en hidden" style="color:#94a3b8;font-size:0.85em;margin-top:4px;">${en}</div>
      </div>
      <button class="audio-btn-sm" onclick="speakBtn('${arEsc}',this)">&#x1F50A;</button>
    </div>`;
  });
  html += '<div class="btn-row" style="margin-top:20px"><button class="btn btn-primary" onclick="startConversation()">Other Scenarios</button><button class="btn btn-back" onclick="showMenu()">Menu</button></div>';
  showActivity(html);
};

function playFullConvo(idx) {
  const lines = CONVERSATIONS[idx].lines;
  let i = 0;
  function playNext() {
    if (i >= lines.length) return;
    const u = speak(lines[i][1], 0.85);
    const bubbles = document.querySelectorAll('.chat-bubble');
    if (bubbles[i]) { bubbles[i].style.borderColor = '#4f9cf7'; }
    u.onend = () => {
      if (bubbles[i]) bubbles[i].style.borderColor = '';
      i++;
      setTimeout(playNext, 600);
    };
  }
  playNext();
}

// ============ INIT ============
const p = updateStreak();
document.getElementById('streakDisplay').textContent = (p.streak||0) + ' day streak';
renderDaySelector();
</script>
